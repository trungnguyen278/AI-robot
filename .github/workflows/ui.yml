name: ui

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "protocol/screen/**"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "ui/**"
      - "protocol/screen/**"
      - ".github/workflows/ui.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests in headless Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Serve the repository
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8000/ > /dev/null && break; sleep 0.5; done
      - name: Renderer
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=20000 \
            --dump-dom http://127.0.0.1:8000/ui/tests/runtime.html > result.html
          python3 ui/tests/result.py result.html
      - name: Single-file builds (the renderer's tests, run on a build of their page)
        run: |
          python3 ui/tools/single_file.py --out studio.html
          python3 ui/tools/single_file.py --fragment --out studio-fragment.html
          python3 ui/tools/single_file.py --page tests/runtime.html --out ui/tests/runtime-single.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=20000             --dump-dom http://127.0.0.1:8000/ui/tests/runtime-single.html > result.html
          python3 ui/tests/result.py result.html
      - name: Previous library (smoke test)
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=60000 \
            --dump-dom http://127.0.0.1:8000/ui/legacy/tests/smoke.html > result.html
          python3 ui/tests/result.py result.html
