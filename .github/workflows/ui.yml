name: ui

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render every variant in headless Chrome
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory ui &
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8000/ > /dev/null && break; sleep 0.5; done
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=60000 \
            --dump-dom http://127.0.0.1:8000/tests/smoke.html > smoke-result.html
          python3 - <<'EOF'
          import html, re, sys
          page = open("smoke-result.html", encoding="utf-8").read()
          match = re.search(r'<pre id="result" data-status="(\w+)"[^>]*>(.*?)</pre>', page, re.S)
          if not match:
              sys.exit("The smoke test did not report a result.")
          print(html.unescape(match.group(2)))
          sys.exit(0 if match.group(1) == "pass" else 1)
          EOF
