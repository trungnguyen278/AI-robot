# Settings shared by every profile: every value the robot uses, as shipped.
#
# To change a value on one machine, do not edit this file: set the key in local.toml,
# which git ignores (see local.example.toml).
#
# Loading order: this file, then profiles/<profile>.toml, then local.toml (optional,
# git-ignored, for one machine). Tables are merged key by key; any other value, lists
# included, is replaced.
#
# [ports.<port>] selects the adapter that implements a port with `adapter`. The other
# keys of the table go to every adapter of that port; a sub-table named after an
# adapter, such as [ports.screen.web], goes only to that adapter.
# [modules.<name>] holds the settings of a module.

[robot]
# The product name shown to people (display, Bluetooth, app). It appears nowhere else:
# code and identifiers never contain it (docs/decisions/0003-neutral-repo-naming.md).
display_name = "Robot"

[log]
level = "INFO"

[app]
shutdown_step_timeout = 5.0  # seconds each step of the shutdown may take before it is skipped

[modules]
# Started in this order and stopped in reverse. settings comes before the modules that
# have settings, so that they apply the owner's choices before they start working.
# motion comes last, so it is the first to stop: the body is made safe before anything
# else shuts down.
enabled = [
  "system", "settings", "voice", "vision", "screen", "setup", "cloud", "behavior", "motion",
]

[modules.system]
battery_interval = 5.0  # seconds between battery reports
charging_scene_seconds = 4.0  # how long the charging scene stays after the robot is plugged in
ready_color = [0, 40, 0]  # the status light while the robot runs: red, green, blue from 0 to 255
low_battery_percent = 15.0  # at or below it, unless charging, the battery is low: shown in red

[modules.behavior]
idle_minutes = 5.0  # with no tap or conversation for this long, the screen shows the clock
sleepy_after_sunset = 0.0  # hours after sunset when the face turns sleepy; it wakes at sunrise
happy_seconds = 2.0  # how long the robot looks pleased after a tap
love_seconds = 3.0  # how long it looks delighted after several quick taps
taps_for_love = 3  # how many taps within tap_window delight it
tap_window = 2.0  # seconds within which taps count together
night_check = 30.0  # seconds between two looks at the time of day

[modules.cloud]
# The safety classes of the capabilities the cloud may use: informational (the screen,
# sounds), privacy (the camera), physical (motion), system (reboot, updates, settings).
# The cloud cannot change this (protocol/cloud/requirements.md, SEC-9).
allowed_classes = ["informational"]
call_timeout = 10.0  # seconds a capability may take before the cloud gets an error

[modules.voice]
# Listening and talking (docs/decisions/0012 and 0013). Durations are in seconds of audio.
voice_threshold = 0.5  # the probability of voice at or above which a window holds voice
end_silence = 2.0  # silence after voice at which the robot ends the speech, if the cloud has not
nothing_heard = 6.0  # without voice this long after a turn starts, the turn is cancelled
barge_in = 0.4  # voice over an answer this long interrupts it
offline_expression = "confused"  # the face when the wake word is heard but the cloud cannot talk
offline_seconds = 2.0  # how long it shows
# As shipped; the owner changes them in the settings (docs/decisions/0016).
volume = 80  # percent of full loudness for the robot's voice, by steps of 5
microphones = true  # whether the robot listens: off, it hears nothing (PRIV-1)

[modules.setup]
# Set-up from the app, over Bluetooth LE (protocol/setup/README.md; docs/decisions/0015).
window = 900.0  # seconds set-up stays open with no session: 15 minutes, Matter's longest
attempts = 20  # failed attempts with the code after which set-up closes, as in Matter
idle = 120.0  # seconds a session may stay silent before it ends
join_timeout = 60.0  # seconds joining a Wi-Fi network may take
bind_timeout = 120.0  # seconds after set-up the screen waits for the server to accept the robot
# What the QR code holds: {setup} stands for the set-up string. An address around it,
# once the app has one, lets a phone's camera open the app.
link = "{setup}"

[modules.screen]
# Microphone loudness (dBFS) that the face's voice reaction maps to 0 and to 1.
# Placeholders until the microphones are measured.
quiet_db = -50.0
loud_db = -10.0
voice_rate = 25.0  # voice levels sent to the screen per second, at most
reaction_seconds = 3.0  # how long an expression the cloud asks for lasts, unless it says
reaction_max_seconds = 30.0  # the longest such expression
scene_max_seconds = 86400.0  # the longest a scene the cloud asks for may stay (a day)

# ---- Raspberry Pi peripherals ----

# Microphones: the speech the XVF3800 array has cleaned up
# (docs/decisions/0011-audio-voice-processor.md). Signed 16-bit PCM. "portaudio" reaches
# them through PipeWire, whose default input is the array (docs/decisions/0013).
[ports.audio_in]
adapter = "sim"
sample_rate = 16000
channels = 1
chunk_ms = 20

[ports.audio_in.portaudio]
device = "default"  # PortAudio's device: "default" is the system's, PipeWire's on the robot

# Speaker, played through the same array, so that its echo canceller hears the robot's voice.
[ports.audio_out]
adapter = "sim"
sample_rate = 16000
channels = 1
buffer_ms = 200.0  # audio queued before write() waits

[ports.audio_out.portaudio]
device = "default"  # PortAudio's device: "default" is the system's, PipeWire's on the robot

# The robot's wake words (docs/decisions/0013). "micro" spots them with microWakeWord
# models: each is the name of a model that comes with pymicro-wakeword (okay_nabu,
# hey_jarvis, hey_mycroft, alexa), or the path to the manifest of a model trained for
# the robot's name. The name is not chosen yet (robot.display_name), so neither is its
# model.
[ports.wake_word]
adapter = "sim"

[ports.wake_word.micro]
models = ["okay_nabu"]

# Voice, told from silence and noise (docs/decisions/0013). "silero": Silero VAD.
[ports.voice_activity]
adapter = "sim"

# Raspberry Pi AI Camera (IMX500).
[ports.camera]
adapter = "sim"
width = 640
height = 480
fps = 15.0

# Screen: the face on the Waveshare 7inch DSI LCD (C), drawn by the renderer in ui/ in a
# full-screen browser (docs/decisions/0006-screen-renderer.md). The browser takes the
# panel's resolution, so it is not set here.
[ports.screen]
adapter = "web"

[ports.screen.web]
# The screen is served at http://<host>:<port>/. 127.0.0.1 keeps it on this computer;
# to watch it from another device, set host = "0.0.0.0" in local.toml.
host = "127.0.0.1"
port = 8770
send_timeout = 1.0  # seconds a page may take to accept a message before it is dropped
heartbeat = 10.0  # seconds between pings that find a page gone silent
close_timeout = 2.0  # seconds a page may take to acknowledge the end of the connection

# The link to ai-robot-server (protocol/cloud/README.md). "sim" until a server exists;
# "livekit" with the server's address, set in local.toml (see local.example.toml).
[ports.cloud]
adapter = "sim"

# How the link behaves (protocol/cloud/README.md). The LiveKit server's address, url,
# is set where the server is chosen: local.toml or a profile.
[ports.cloud.livekit]
# Where the robot gets the token to join its room: "server", from ai-robot-server at url
# (https://), with its identity; or "development", made with the key of a development
# LiveKit server at url (ws://), from the environment (see local.example.toml).
tokens = "server"
room = "robot"  # the room of the tokens the robot makes for a development server...
participant = "robot"  # ...and the robot's name in it
connect_timeout = 10.0  # seconds to join the room
hello_timeout = 5.0  # seconds the cloud's agent has to answer the robot's hello
reconnect_first = 1.0  # seconds: the longest wait before the first new attempt
reconnect_max = 60.0  # seconds: the longest wait between attempts
rate = 50.0  # messages a second the robot handles from the cloud...
burst = 100  # ...in bursts of up to this many...
backlog = 500  # ...while up to this many more wait their turn; it drops the rest
catalogue_ttl = 60.0  # seconds the cloud may cache the robot's catalogue

# The robot's identity: an identifier, and the key that proves it to ai-robot-server
# (docs/decisions/0010-device-identity.md). "tpm" keeps them in the robot's TPM, as the pi
# profile does; "sim" makes a new one at each start, which no server knows; "file" keeps
# one in a file, for a development computer: set its path in local.toml.
[ports.identity]
adapter = "sim"

[ports.identity.tpm]
# How the TCG software stack reaches the TPM: through the kernel's resource manager.
tcti = "device:/dev/tpmrm0"

# Where the robot keeps what its owner chose in its settings (docs/decisions/0016).
# "sim" keeps them in memory; "file" keeps them in a file, on the robot's data partition.
[ports.settings]
adapter = "sim"

[ports.settings.file]
# In the robot's state directory (XDG's, in the home of the user who runs it).
path = "~/.local/state/ai-robot/settings.json"

# Where the robot keeps its binding: the server it was registered with at set-up, and
# whether that server accepts it (protocol/setup/README.md). "sim" keeps it in memory, as
# a robot the simulated cloud knows; "file" keeps it in a file, on the robot's data
# partition.
[ports.binding]
adapter = "sim"

[ports.binding.sim]
bound = true

[ports.binding.file]
# In the robot's state directory (XDG's, in the home of the user who runs it).
path = "~/.local/state/ai-robot/binding.json"

# The link the app sets the robot up through: Bluetooth LE (protocol/setup/README.md).
# "bluez": the Pi's Bluetooth, through BlueZ on D-Bus.
[ports.setup_link]
adapter = "sim"

[ports.setup_link.bluez]
adapter = "hci0"  # the Bluetooth controller: the Pi's own
bus = "system"  # the D-Bus BlueZ is on; tests give another bus's address
confirm_timeout = 5.0  # seconds an app has to confirm a fragment, before it is dropped

# The robot's Wi-Fi: the networks it sees and joins. "sim" sees the networks below, which
# take any password.
[ports.network]
adapter = "sim"

[ports.network.sim]
networks = [{ssid = "Simulated", security = "wpa2", signal = 70}]

# "networkmanager": the system's network service, on D-Bus.
[ports.network.networkmanager]
interface = "wlan0"  # the Wi-Fi interface: the Pi's own
bus = "system"  # the D-Bus NetworkManager is on; tests give another bus's address
scan_timeout = 10.0  # seconds a scan for networks may take

# When the sun rises and sets. "fixed" until the robot's place is known; for the real
# times, select "solar" in local.toml with the robot's latitude and longitude (see
# local.example.toml), so that the place stays on this machine.
[ports.daylight]
adapter = "fixed"

[ports.daylight.fixed]
sunrise = "06:00"
sunset = "18:00"

# ---- Body: simulated until the body controller is chosen (docs/decisions/0004) ----

# Tracked chassis, driven like a differential-drive robot.
[ports.drive]
adapter = "sim"
max_linear = 0.5  # m/s, placeholder: the motor specifications are unverified
max_angular = 2.0  # rad/s, placeholder
max_ttl = 1.0  # s: the longest a drive command lasts unless it is renewed

# Neck (2 DOF) and arms (3 DOF each). Angles in radians; `home` defaults to 0.
# Placeholder names and limits until the arm design is fixed
# (hardware/README.md, open issue 9).
[ports.joints]
adapter = "sim"
joints = [
  { name = "neck_pan", lower = -1.57, upper = 1.57 },
  { name = "neck_tilt", lower = -0.5, upper = 0.5 },
  { name = "left_arm_1", lower = -1.57, upper = 1.57 },
  { name = "left_arm_2", lower = -1.57, upper = 1.57 },
  { name = "left_arm_3", lower = -1.57, upper = 1.57 },
  { name = "right_arm_1", lower = -1.57, upper = 1.57 },
  { name = "right_arm_2", lower = -1.57, upper = 1.57 },
  { name = "right_arm_3", lower = -1.57, upper = 1.57 },
]

# Distance ahead (VL53L1X time-of-flight sensor).
[ports.range]
adapter = "sim"

[ports.range.sim]
distance = 2.0  # metres the simulated sensor sees

# Battery monitoring.
[ports.power]
adapter = "sim"

[ports.power.sim]
# What the simulated battery reports. Change them in local.toml to try a low battery.
voltage = 11.1
percent = 50.0
charging = false

# Status LEDs (NeoPixel).
[ports.lights]
adapter = "sim"

# Emergency stop.
[ports.safety]
adapter = "sim"

[ports.safety.sim]
engaged = false  # whether the simulated emergency stop starts pressed
