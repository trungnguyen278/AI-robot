# Settings for one machine only. Copy this file to local.toml, which git ignores, and
# uncomment what you need. It is merged on top of base.toml and the selected profile:
# a key set here changes that one value, and every other value stays as shipped.
#
# Any key of base.toml can be set here: copy its table header and the key, then change
# the value. Every setting below is valid once uncommented (tests/test_registry.py).

# [log]
# level = "DEBUG"

# [ports.camera]
# fps = 5.0

# Watch the screen from another device on the network (anyone on it can then see it):
# [ports.screen.web]
# host = "0.0.0.0"

# Sunrise and sunset computed for where the robot is: latitude and longitude in
# degrees, north and east positive. They stay on this machine.
# [ports.daylight]
# adapter = "solar"
# [ports.daylight.solar]
# latitude = 0.0
# longitude = 0.0

# Connect to ai-cloud instead of the simulated cloud. The robot asks it for its tokens,
# proving who it is with the key of its identity: keep one in a file on this computer.
# https:// in general; http:// only to this computer, for development.
# [ports.cloud]
# adapter = "websocket"
# [ports.cloud.websocket]
# server = "https://cloud.example"
# [ports.identity]
# adapter = "file"
# [ports.identity.file]
# path = "~/.config/ai-robot/identity.json"  # made on first use; only you may read it

# Talk to the robot with this computer's microphone and speaker. Use headphones:
# without the robot's voice processor, nothing cancels its own voice.
# [ports.audio_in]
# adapter = "portaudio"
# [ports.audio_out]
# adapter = "portaudio"
# [ports.wake_word]
# adapter = "micro"
# [ports.voice_activity]
# adapter = "silero"

# Set the robot up from the app over this computer's Bluetooth, joining Wi-Fi networks
# through its NetworkManager (Linux; software/README.md says what they need). Keep the
# binding in a file, as the robot does.
# [ports.setup_link]
# adapter = "bluez"
# [ports.network]
# adapter = "networkmanager"
# [ports.network.networkmanager]
# interface = "wlp2s0"  # this computer's Wi-Fi interface, as `nmcli device` lists it
# [ports.binding]
# adapter = "file"

# Tune how the robot behaves, for example a longer smile after a tap:
# [modules.behavior]
# happy_seconds = 3.0

# Try a low battery on its charger, without the hardware:
# [ports.power.sim]
# percent = 12.0
# charging = true
