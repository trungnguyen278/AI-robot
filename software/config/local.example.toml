# Settings for one machine only. Copy this file to local.toml (git-ignored); it is
# merged on top of the selected profile.

# [log]
# level = "DEBUG"

# [ports.camera]
# fps = 5.0

# Watch the screen from another device on the network (anyone on it can then see it):
# [ports.screen.web]
# host = "0.0.0.0"

# Sunrise and sunset computed for where the robot is: latitude and longitude in
# degrees, north and east positive. They stay on this machine.
# [ports.daylight]
# adapter = "solar"
# [ports.daylight.solar]
# latitude = 0.0
# longitude = 0.0

# Connect to a cloud server instead of the simulated one. wss:// in general; ws:// only
# to this computer, for development. The robot's credentials go in the environment
# variable AI_ROBOT_CLOUD_TOKEN, never in a file.
# [ports.cloud]
# adapter = "websocket"
# [ports.cloud.websocket]
# url = "wss://cloud.example/robot"
