[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-robot"
version = "0.1.0"
description = "Robot software for the Raspberry Pi 5"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.13,<4",  # the screen served to a browser, and requests to the cloud
  "cryptography>=46,<51",  # keys kept in software (adapters/keys); set-up's encryption (core)
  "pycryptodome>=4.0.1,<5",  # set-up's SPAKE2+: arithmetic on P-256 points (core/spake2plus.py)
  "dbus-fast>=5.2,<6; sys_platform == 'linux'",  # D-Bus: BlueZ and NetworkManager
  "pymicro-wakeword>=2.5,<3",  # wake words, with microWakeWord models (adapters/microwakeword)
  "pysilero-vad>=3.4,<4",  # voice, with Silero VAD (adapters/silero)
  "sounddevice>=0.5.6,<0.6",  # microphones and speaker through PortAudio (adapters/portaudio)
  "jsonschema>=4.23,<5",  # checking data against the protocols' JSON Schemas
  "livekit>=1.1.21,<2",  # the cloud link over WebRTC (adapters/livekit)
  "livekit-api>=1.2.2,<2",  # tokens for a development LiveKit server
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.17,<0.18",
]
tpm = [
  "tpm2-pytss>=3,<4",  # the robot's TPM (adapters/tpm), built against libtss2-dev
]

[project.scripts]
ai-robot = "ai_robot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_robot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
