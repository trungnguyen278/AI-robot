<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<!-- The robot's screen: a full-screen browser shows this page, served by the robot
     software, which drives it over the screen protocol (protocol/screen/README.md).
     Add #round to the address on a round display. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06090d; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; touch-action: none; }
  /* A dim dot in a corner while the software is unreachable. */
  #offline {
    position: fixed; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%;
    background: #ff5b6e; opacity: 0.5;
  }
</style>
</head>
<body>
<canvas id="screen" aria-label="The robot's face"></canvas>
<div id="panel"></div>
<div id="offline" hidden></div>
<script type="module">
  import { Animator } from './src/animator.js';
  import { Link } from './src/link.js';
  import { PanelView } from './src/panel.js';
  import { Player } from './src/player.js';
  import { Press } from './src/press.js';
  import { SCENES } from './src/scenes/index.js';
  import { SETTINGS } from './src/settings.js';

  const canvas = document.getElementById('screen');
  const offline = document.getElementById('offline');
  const shape = location.hash === '#round' ? 'round' : 'rect';
  const animator = new Animator({ seed: Date.now() });
  // The screen wakes up as the page opens: the start-up plays to its end, then the
  // software's latest state shows.
  animator.setScene('boot', {}, 0, { instant: true, hold: SCENES.boot.length });
  const player = new Player(canvas, animator, { shape });
  player.start();

  // Panels, such as the settings, over the face.
  const panel = new PanelView(document.getElementById('panel'), {
    shape,
    onAction: (name, item, value) => link.action(name, item, value),
    onClose: (name) => link.close(name),
  });

  // Show the dot only when the software has been unreachable for a while.
  let timer = setTimeout(() => { offline.hidden = false; }, 2000);
  const link = new Link(player, {
    panel,
    onChange(connected) {
      clearTimeout(timer);
      if (connected) offline.hidden = true;
      else timer = setTimeout(() => { offline.hidden = false; }, 2000);
    },
  });
  link.connect();

  // Taps on the face, and presses held still on it.
  const fraction = (x, y) => {
    const box = canvas.getBoundingClientRect();
    return [(x - box.left) / box.width, (y - box.top) / box.height];
  };
  const press = new Press({ ...SETTINGS.hold, onHold: (x, y) => link.hold(...fraction(x, y)) });
  canvas.addEventListener('pointerdown', (event) => {
    link.touch(...fraction(event.clientX, event.clientY));
    if (event.isPrimary) press.down(event.clientX, event.clientY);
  });
  canvas.addEventListener('pointermove', (event) => {
    if (event.isPrimary) press.move(event.clientX, event.clientY);
  });
  for (const type of ['pointerup', 'pointercancel', 'pointerleave']) {
    canvas.addEventListener(type, (event) => {
      if (event.isPrimary) press.up();
    });
  }
  // A long press on a touch screen would open the browser's menu.
  canvas.addEventListener('contextmenu', (event) => event.preventDefault());
</script>
</body>
</html>
